.count { text-align: right; }

.skill i { width: 10px; height: 26px; background: linear-gradient(#ffb060,#d8523a); transform: rotate(35deg); box-shadow: 0 0 10px #ff7a40; display: block; }
.skill span { font-size: 15px; } .skill small { display: block; color: var(--muted); font-size: 11px; }

.card p { margin: 6px 0 18px; color: var(--muted); }

function spawnZ() {
  const a = Math.random() * 6.283, d = 15 + Math.random() * 7; let x = P.x + Math.cos(a) * d, z = P.z + Math.sin(a) * d;

function blocked(x, z, r) { for (const o of obst) { const dx = x - o.x, dz = z - o.z, rr = r + o.r; if (dx * dx + dz * dz < rr * rr) return o; } return null; }

function end(win) {

  $('endT').textContent = win ? '十僵超度！' : '道长倒下了';
  $('endP').textContent = win ? '10 只僵尸全部超度，剩余阳气 ' + Math.max(0, Math.round(hp)) + '。' : '超度了 ' + kills + ' / ' + TOTAL + ' 只。再来一次？';

function step(dt) {

}
// ---------- 输入 ----------
addEventListener('keydown', e => { keys[e.code] = true; if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault(); if ((e.code === 'KeyR' || e.code === 'Enter') && state !== 'play') reset(); });
