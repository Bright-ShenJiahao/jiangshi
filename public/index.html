<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>暂时停止呼吸</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: full-screen pixel canvas, DOM HUD on top, modal panels for title / level-up / end */
:root {
  --night: #140c22; --ink: #1a0e1e; --panel: #2a1d40; --line: #4a3866;
  --paper: #f4e4a8; --talisman: #f0c020; --seal: #c8302c; --jade: #6cc8a0; --text: #ece4ff; --muted: #a99cc8;
  --display: "ZCOOL QingKe HuangYou", "PingFang SC", "Microsoft YaHei", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--text); font-family: var(--display); overflow: hidden; user-select: none; -webkit-user-select: none; }
#wrap { position: fixed; inset: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }
#hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px; pointer-events: none; }
.bars { display: grid; gap: 4px; min-width: 0; }
.bar { height: 10px; background: var(--ink); border: 2px solid var(--ink); box-shadow: 0 0 0 1px var(--line); position: relative; max-width: 220px; }
.bar i { position: absolute; inset: 0; transform-origin: left; display: block; }
#hpb i { background: linear-gradient(var(--seal), #8a1818); }
#xpb i { background: linear-gradient(#ffe070, #c89018); }
.lbl { font-size: 13px; color: var(--muted); letter-spacing: .05em; }
#clock { text-align: center; }
#clock b { font-size: 26px; color: var(--paper); letter-spacing: .12em; text-shadow: 2px 2px 0 var(--ink); font-weight: 400; display: block; line-height: 1; }
#clock .lbl { display: block; margin-top: 2px; }
#combo { display: block; margin-top: 6px; font-size: 22px; color: var(--talisman); text-shadow: 2px 2px 0 var(--seal), 4px 4px 0 var(--ink); min-height: 1em; }
#stats { text-align: right; font-size: 15px; text-shadow: 2px 2px 0 var(--ink); }
#breath { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--ink); background: radial-gradient(circle at 40% 35%, #8fd8f0, #2e6a94); color: var(--ink); font: 20px var(--display); box-shadow: 0 0 0 2px var(--line), 0 4px 0 var(--ink); cursor: pointer; }
#breath:disabled { background: #3a3150; color: var(--muted); }
#ult { position: absolute; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 90px); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); width: 66px; height: 66px; border-radius: 50%; border: 3px solid var(--ink); background: radial-gradient(circle at 40% 35%, #ffe070, #c8302c); color: var(--ink); font: 26px var(--display); box-shadow: 0 0 0 2px var(--line), 0 4px 0 var(--ink); cursor: pointer; line-height: 1; }
#ult:disabled { background: #3a3150; color: var(--muted); }
#ult small { display: block; font-size: 11px; }
#breath small { display: block; font-size: 11px; }
.modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(12, 6, 22, .72); padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.card { background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 0 0 2px var(--line), 6px 6px 0 var(--ink); padding: 22px 22px 20px; max-width: 560px; width: 100%; text-align: center; }
h1 { font-size: clamp(34px, 9.5vw, 64px); font-weight: 400; color: var(--paper); letter-spacing: .14em; margin: 0; text-shadow: 4px 4px 0 var(--seal), 7px 7px 0 var(--ink); }
h2 { font-size: 34px; font-weight: 400; color: var(--paper); margin: 0 0 6px; letter-spacing: .1em; text-shadow: 3px 3px 0 var(--ink); }
.card p { color: var(--muted); font-size: 16px; line-height: 1.6; margin: 10px 0; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; text-align: left; max-width: 340px; margin: 14px auto; font-size: 15px; }
.keys span:nth-child(odd) { color: var(--talisman); }
.btn { font: 22px var(--display); background: var(--talisman); color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); padding: 8px 28px; cursor: pointer; letter-spacing: .1em; margin-top: 6px; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible, .opt:focus-visible, #breath:focus-visible { outline: 3px solid var(--jade); outline-offset: 2px; }
.opts { display: grid; gap: 10px; margin-top: 14px; }
.opt { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--ink); border: 3px solid var(--line); padding: 10px 12px; color: var(--text); font: 17px var(--display); cursor: pointer; }
.opt:hover { border-color: var(--talisman); }
.opt.ult { position: relative; background: linear-gradient(135deg, #5a1424, #2a0c1a); border-color: #e8b830; animation: ultglow 1.6s ease-in-out infinite; overflow: hidden; }
.opt.ult .seal { border-radius: 50%; width: 56px; height: 56px; background: radial-gradient(circle at 40% 35%, #fff0a0, #d89a20); color: #6a1010; border-color: #6a1010; font-size: 32px; }
.opt.ult::after { content: '大招'; position: absolute; top: 6px; right: -22px; transform: rotate(35deg); background: var(--seal); color: var(--paper); font-size: 12px; padding: 2px 26px; border-top: 1px solid #ffd060; border-bottom: 1px solid #ffd060; }
.opt.ult .lv { color: #ffd060; }
@keyframes ultglow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 208, 64, .25); } 50% { box-shadow: 0 0 18px 2px rgba(255, 208, 64, .55); } }
.diffs { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn.hard { background: var(--seal); color: var(--paper); }
.btn.small { font-size: 17px; padding: 6px 14px; margin: 0; }
.hint { font-size: 13px !important; margin: 8px 0 0 !important; }
.score { font-size: 18px !important; color: var(--text) !important; }
.score b { color: var(--talisman); font-size: 30px; font-weight: 400; }
#nameForm { display: flex; gap: 8px; justify-content: center; margin: 8px 0 12px; flex-wrap: wrap; }
#nameIn { font: 18px var(--display); background: var(--ink); color: var(--text); border: 2px solid var(--line); padding: 6px 10px; width: 11em; max-width: 100%; }
#nameIn:focus-visible { outline: 3px solid var(--jade); outline-offset: 1px; }
#board { max-height: 240px; overflow-y: auto; margin-bottom: 10px; }
#board h3 { font-size: 18px; font-weight: 400; color: var(--paper); margin: 4px 0 6px; letter-spacing: .1em; }
#board table { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
#board td, #board th { padding: 3px 6px; text-align: left; border-bottom: 1px solid var(--line); }
#board th { color: var(--muted); font-weight: 400; font-size: 13px; }
#board td:nth-child(3) { color: var(--talisman); text-align: right; }
#board th:nth-child(3) { text-align: right; }
#board tr.me td { background: rgba(240, 192, 32, .12); }
#board .empty { color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .opt.ult { animation: none; } }
.seal { width: 52px; height: 52px; display: grid; place-items: center; font-size: 30px; background: var(--seal); color: var(--paper); border: 2px solid var(--ink); }
.opt .d { color: var(--muted); font-size: 14px; display: block; margin-top: 2px; line-height: 1.35; }
.opt .lv { color: var(--talisman); font-size: 15px; white-space: nowrap; }
.opt .new { color: var(--jade); }
#banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-size: clamp(34px, 9vw, 60px); color: var(--paper); text-shadow: 3px 3px 0 var(--seal), 6px 6px 0 var(--ink); pointer-events: none; letter-spacing: .15em; }
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div class="bars">
      <span class="lbl">阳气</span><div class="bar" id="hpb"><i></i></div>
      <span class="lbl" id="lvl">修为 一重</span><div class="bar" id="xpb"><i></i></div>
    </div>
    <div id="clock"><b id="shichen">子时</b><span class="lbl" id="till">距鸡鸣 5:00</span><span id="combo"></span></div>
    <div id="stats">伏尸 <span id="kills">0</span><br><button id="mute" style="pointer-events:auto;margin-top:6px;font:14px var(--display);background:var(--ink);color:var(--text);border:2px solid var(--line);padding:2px 8px;cursor:pointer">声音 开</button></div>
  </div>
  <button id="breath" hidden>屏息<small>空格</small></button>
  <button id="ult" hidden>雷<small>Q</small></button>
  <div id="banner" hidden></div>

  <div class="modal" id="title">
    <div class="card">
      <h1>暂时停止呼吸</h1>
      <p>荒坟夜里尸变了。撑到鸡鸣天亮，便算你赢。</p>
      <div class="keys">
        <span>移动</span><span>WASD / 方向键，手机按住屏幕拖动</span>
        <span>出招</span><span>法器自动出手，升级时三选一</span>
        <span>屏息</span><span>空格：僵尸闻不到人气，会乱跳</span>
        <span>大招</span><span>Q 键或右下角按钮（升级时获得）</span>
        <span>暂停</span><span>P 键</span>
      </div>
      <div class="diffs"><button class="btn" id="startBtn">开坛 · 普通</button><button class="btn hard" id="hardBtn">开坛 · 困难</button></div>
      <p class="hint">困难：怪更硬更疼、出招更勤，积分 ×1.5</p>
    </div>
  </div>

  <div class="modal" id="levelup" hidden>
    <div class="card"><h2 id="lvTitle">修为精进</h2><p style="margin:0">选一样法门（按 1 / 2 / 3）</p><div class="opts" id="opts"></div></div>
  </div>

  <div class="modal" id="end" hidden>
    <div class="card"><h2 id="endT"></h2><p id="endP"></p>
      <p class="score">积分 <b id="scoreV">0</b></p>
      <form id="nameForm"><input id="nameIn" maxlength="10" placeholder="留下道号" autocomplete="off" aria-label="道号"><button class="btn small" type="submit" id="saveBtn">记入功德簿</button></form>
      <div id="board"></div>
      <button class="btn" id="againBtn">再来一夜</button></div>
  </div>

  <div class="modal" id="pause" hidden>
    <div class="card"><h2>暂停</h2><p>按 P 或点按钮继续</p><button class="btn" id="resumeBtn">继续</button></div>
  </div>
</div>

// ---------- update ----------
let DT = 0, last = performance.now();

      else if (S.t > 120 && Math.random() < 0.05) spawnElite();

    }
    if (Math.floor(S.t) % 45 === 44 && !S['wave' + Math.floor(S.t)]) {
      S['wave' + Math.floor(S.t)] = 1;
      const a = Math.random() * 6.28;
      for (let i = 0; i < 12; i++) spawn('ghost', Math.max(14, Math.min(WORLD.w - 14, P.x + Math.cos(a) * 200 + rnd(-20, 20))), Math.max(20, Math.min(WORLD.h - 12, P.y + Math.sin(a) * 150 + rnd(-20, 20))));
    }
  }

  // player
  let mx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);

    if (e.type === 'king' && e.st === 'slash' && !e.fired) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.5 * Math.abs(Math.sin(S.t * 25)); g.drawImage(im, X, Y, iw, ih); g.globalCompositeOperation = 'source-over'; }
    g.restore();
    if (e.buff > S.t) { const ay = Y - 5; px(e.x + 3, ay, 5, 1, '#ff3a3a'); px(e.x + 5, ay - 2, 1, 5, '#ff3a3a'); px(e.x + 3, ay - 2, 1, 1, '#ff3a3a'); px(e.x + 7, ay + 2, 1, 1, '#ff3a3a'); }
    if (e.stun) { px(e.x - 3 + face * 3, Y + 9, 5, 7, '#1a0e1e'); px(e.x - 2 + face * 3, Y + 10, 3, 5, '#ffe470'); px(e.x - 1 + face * 3, Y + 11, 1, 3, '#c8302c'); }
    if (P.breath > 0 && e.type !== 'king') { const qy = Y - 9 + Math.round(Math.sin(S.t * 8 + e.id) ); px(e.x - 3, qy, 7, 8, '#1a0e1e'); px(e.x - 2, qy + 1, 5, 6, '#fff'); g.fillStyle = '#1a0e1e'; g.font = 'bold 7px monospace'; g.textAlign = 'center'; g.fillText('?', Math.round(e.x) + 0.5, qy + 7); }
    if (e.type === 'king') { const w = 30; px(e.x - w / 2, Y - 6, w, 3, '#1a0e1e'); px(e.x - w / 2 + 1, Y - 5, (w - 2) * Math.max(0, e.hp / e.max), 1, '#c8302c'); }
  }

  // boss suck effect
  if (kg === undefined) {}
  for (const e of S.en) if (e.type === 'king' && e.st === 'suck' && e.stT > 0.4 && !e.dead) {
    g.strokeStyle = '#d070ff'; g.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
      const k = ((S.t * 1.5 + i / 6) % 1), x = P.x + (e.x - P.x) * k, y = (P.y - 10) + (e.y - 24 - (P.y - 10)) * k, r = 10 * (1 - k) + 3;
      g.globalAlpha = 0.7 * (1 - k * 0.5); g.beginPath(); g.arc(x, y, r, S.t * 8 + i, S.t * 8 + i + 4); g.stroke();
    }
    g.globalAlpha = 0.35; g.beginPath(); g.arc(e.x, e.y - 24, 20 + 4 * Math.sin(S.t * 12), 0, 7); g.stroke(); g.globalAlpha = 1;
  }
  // bats around the church
  if (MAP.bats) {
    const [bx0, by0] = MAP.bats;
    if (bx0 > cx - 80 && bx0 < cx + VW + 80 && by0 > cy - 80 && by0 < cy + VH + 80)
      for (let i = 0; i < 7; i++) {
        const a = S.t * (0.9 + i * 0.08) + i * 0.9, bx = bx0 + Math.cos(a) * (24 + i * 5), by = by0 + 24 + Math.sin(a * 1.7) * 14 + i * 3, up = Math.sin(S.t * 18 + i * 2) > 0;
        px(bx - 1, by - 1, 3, 2, '#1a0e1e'); px(bx - 4, by + (up ? -3 : 0), 3, 2, '#1a0e1e'); px(bx + 2, by + (up ? -3 : 0), 3, 2, '#1a0e1e'); px(bx, by - 1, 1, 1, '#ff3a3a');
      }
  }
  // swords
  if (S.w.sword) {
    const lv = S.w.sword, n = swordN(lv);
    for (let i = 0; i < n; i++) {
      const a = S.swordAng + i * Math.PI * 2 / n;
      g.globalAlpha = 0.25; g.strokeStyle = '#ffe9b0'; g.lineWidth = 3; g.beginPath(); g.ellipse(P.x, P.y - 10, swordLen(lv) - 2, (swordLen(lv) - 2) * 0.75, 0, a - 1.1, a); g.stroke(); g.globalAlpha = 1;
      drawSword(P.x + Math.cos(a) * 3, P.y - 10 + Math.sin(a) * 2, Math.atan2(Math.sin(a) * 0.75, Math.cos(a)), swordLen(lv));
    }
  }
  // shots
  for (const s of S.shots) {
    if (s.k === 'fu') {
      g.save(); g.translate(Math.round(s.x), Math.round(s.y)); g.rotate(Math.sin(s.spin) * 0.6);
      px(-2, -3, 5, 7, '#1a0e1e'); px(-1, -2, 3, 5, '#ffe470'); px(0, -1, 1, 3, '#c8302c'); g.restore();
    } else if (s.k === 'csword') {
      const sc = s.big ? 1.4 : 1;
      g.save(); g.translate(Math.round(s.x), Math.round(s.y)); g.rotate(Math.atan2(s.vy, s.vx) + (s.out ? 0 : Math.PI)); g.scale(sc, sc);
      g.globalAlpha = 0.3; px(-16, -1, 8, 2, '#ffe9b0'); g.globalAlpha = 1;
      px(-9, -1, 18, 2, '#c8302c');
      for (let c = -8; c <= 8; c += 4) { px(c - 2, -2, 4, 4, '#1a0e1e'); px(c - 1, -1, 2, 2, '#e8b830'); }
      px(-11, -2, 2, 4, '#1a0e1e'); px(-13, 0, 2, 3, '#c8302c'); g.restore();
    }
  }
  // ultimates
  for (const s of S.sweeps) {
    g.globalAlpha = 0.25; g.fillStyle = '#ffe9b0'; g.fillRect(Math.round(s.x - s.dir * 40), s.y0, 40, s.y1 - s.y0); g.globalAlpha = 1;
    for (let y = s.y0 + 10, i = 0; y < s.y1; y += 20, i++) drawSword(s.x + (i % 2) * s.dir * -8, y, s.dir > 0 ? 0 : Math.PI, 30);
  }
  for (const w of S.whisks) {
    const a = w.ang ?? w.a0, ox = P.x, oy = P.y - 12, sg = Math.sign(w.span);
    g.globalAlpha = 0.18; g.strokeStyle = '#ffd860'; g.lineWidth = w.R * 0.55; g.beginPath(); g.arc(ox, oy, w.R * 0.66, sg > 0 ? a - 0.9 : a, sg > 0 ? a : a + 0.9); g.stroke(); g.globalAlpha = 1;
    const hx = ox + Math.cos(a) * w.R * 0.32, hy = oy + Math.sin(a) * w.R * 0.32;
    g.strokeStyle = '#1a0e1e'; g.lineWidth = 6; g.beginPath(); g.moveTo(ox, oy); g.lineTo(hx, hy); g.stroke();
    g.strokeStyle = '#c89030'; g.lineWidth = 3; g.beginPath(); g.moveTo(ox, oy); g.lineTo(hx, hy); g.stroke();
    for (let k = -7; k <= 7; k++) {
      const aa = a + k * 0.025 - sg * Math.abs(k) * 0.01, L = w.R * (0.92 + 0.08 * Math.sin(S.t * 30 + k));
      g.strokeStyle = k % 3 ? '#f4f0e0' : '#ffe070'; g.lineWidth = 2; g.globalAlpha = 0.9;
      g.beginPath(); g.moveTo(hx, hy); g.lineTo(ox + Math.cos(aa) * L, oy + Math.sin(aa) * L); g.stroke();
    }
    g.globalAlpha = 1; px(hx - 3, hy - 3, 6, 6, '#ffe070');
  }
  for (const s of S.eshots) {
    if (s.k === 'wisp') { const f = Math.sin(S.t * 30 + s.x) > 0; g.globalAlpha = 0.35; g.fillStyle = '#5ab8ff'; g.beginPath(); g.arc(s.x, s.y, 6, 0, 7); g.fill(); g.globalAlpha = 1; px(s.x - 2, s.y - (f ? 4 : 3), 4, 6, '#1a0e1e'); px(s.x - 1, s.y - 2, 2, 4, '#9ad8ff'); px(s.x - 1, s.y - 1, 2, 2, '#ffffff'); continue; }
    g.save(); g.translate(Math.round(s.x), Math.round(s.y)); g.rotate(s.a);
    g.globalAlpha = 0.4; g.strokeStyle = '#8fd8ff'; g.lineWidth = 6; g.beginPath(); g.arc(-4, 0, 11, -1.1, 1.1); g.stroke();
    g.globalAlpha = 1; g.strokeStyle = '#f0faff'; g.lineWidth = 2; g.beginPath(); g.arc(-4, 0, 11, -1.1, 1.1); g.stroke(); g.restore();
  }
  // pulses
  for (const f of S.fx) {
    if (f.k === 'chain') {
      g.globalAlpha = 1 - f.t / 0.35; g.lineWidth = 2; g.strokeStyle = '#8fe8ff'; g.beginPath(); g.moveTo(f.x1, f.y1);
      for (let k2 = 1; k2 < 5; k2++) g.lineTo(f.x1 + (f.x2 - f.x1) * k2 / 5 + rnd(-4, 4), f.y1 + (f.y2 - f.y1) * k2 / 5 + rnd(-4, 4));
      g.lineTo(f.x2, f.y2); g.stroke(); g.globalAlpha = 1; continue;
    }
    if (f.k === 'wave') {
      const k = f.t / 0.35;
      g.globalAlpha = 1 - k; g.strokeStyle = '#bfe8ff'; g.lineWidth = 2;
      for (const m of [1, 0.7, 0.4]) { const r = f.R * k * m; if (r < 3) continue; g.beginPath(); g.arc(f.x, f.y, r, f.a - f.half, f.a + f.half); g.stroke(); }
      g.globalAlpha = 1; continue;
    }
    const k = f.t / 0.35, r = f.r + (f.R - f.r) * k;
    g.globalAlpha = 1 - k; g.strokeStyle = f.c || '#fff6c0'; g.lineWidth = 3; g.beginPath(); g.ellipse(f.x, f.y, r, r * 0.72, 0, 0, 7); g.stroke();
    g.strokeStyle = '#ffe070'; g.lineWidth = 1; g.beginPath(); g.ellipse(f.x, f.y, r * 0.8, r * 0.58, 0, 0, 7); g.stroke(); g.globalAlpha = 1;
  }
  for (const q of S.parts) { g.globalAlpha = Math.min(1, q.t * 3); px(q.x, q.y, 2, 2, q.c); } g.globalAlpha = 1;
  // texts
  g.textAlign = 'center';
  for (const t of S.texts) { g.font = t.big ? 'bold 11px monospace' : 'bold 8px monospace'; g.globalAlpha = Math.min(1, t.t * 3); g.fillStyle = '#1a0e1e'; g.fillText(t.v, Math.round(t.x) + 1, Math.round(t.y) + 1); g.fillStyle = t.c; g.fillText(t.v, Math.round(t.x), Math.round(t.y)); }
  g.globalAlpha = 1;
  g.restore();

  // night tint, lifts toward dawn
  const dawn = Math.max(0, (S.t - ROOSTER_AT) / (NIGHT - ROOSTER_AT));
  g.fillStyle = `rgba(${Math.round(20 + 120 * dawn)},${Math.round(8 + 60 * dawn)},${Math.round(40 - 10 * dawn)},${0.22 - 0.1 * dawn})`; g.fillRect(0, 0, VW, VH);
  const vg = g.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
  vg.addColorStop(0, 'rgba(8,4,16,0)'); vg.addColorStop(1, 'rgba(8,4,16,.6)'); g.fillStyle = vg; g.fillRect(0, 0, VW, VH);
  if (P.breath > 0) { g.fillStyle = 'rgba(80,160,220,.12)'; g.fillRect(0, 0, VW, VH); }
  if (S.flash > 0) { g.fillStyle = `rgba(230,245,255,${Math.min(0.15, S.flash * 3)})`; g.fillRect(0, 0, VW, VH); }

  ctx.drawImage(low, 0, 0, cv.width, cv.height);
  if (joy.on) {
    ctx.globalAlpha = 0.35; ctx.strokeStyle = '#ece4ff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.ox * devicePixelRatio / devicePixelRatio, joy.oy, 40, 0, 7); ctx.stroke();
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, l = Math.min(40, Math.hypot(dx, dy)), a = Math.atan2(dy, dx);
    ctx.fillStyle = '#ece4ff'; ctx.beginPath(); ctx.arc(joy.ox + Math.cos(a) * l, joy.oy + Math.sin(a) * l, 14, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  }
}

const SHI = [['子时', 0], ['丑时', 50], ['寅时', 150], ['卯时', 250]];
function hud() {
  const P = S.p;
  $('hpb').firstElementChild.style.transform = `scaleX(${P.hp / P.max})`;
  $('xpb').firstElementChild.style.transform = `scaleX(${S.xp / S.need})`;
  $('lvl').textContent = `修为 ${cn(S.lv)}重`;
  let name = '子时'; for (const [n, t] of SHI) if (S.t >= t) name = n;
  $('shichen').textContent = name;
  const left = Math.max(0, NIGHT - S.t);
  $('till').textContent = `距鸡鸣 ${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')}`;
  $('kills').textContent = S.kills;
  $('combo').textContent = S.combo >= 5 ? (S.combo < 100 ? cn(S.combo) : S.combo) + '连斩' : '';
  if (S.ult) { const u = $('ult'); u.disabled = S.ultCd > 0; const h = `${ULTS[S.ult.k].seal}<small>${S.ultCd > 0 ? Math.ceil(S.ultCd) + '秒' : 'Q'}</small>`; if (u.innerHTML !== h) u.innerHTML = h; }
  const b = $('breath'); b.disabled = P.breathCd > 0;
  b.innerHTML = P.breathCd > 0 ? `${Math.ceil(P.breathCd)}<small>秒</small>` : '屏息<small>空格</small>';
}

// title-screen backdrop
function drawIdle(t) {
  g.fillStyle = '#140c22'; g.fillRect(0, 0, VW, VH);
  if (IMG.bg.complete) g.drawImage(IMG.bg, -Math.round(260 + Math.sin(t / 4000) * 60), -200);
  g.fillStyle = 'rgba(8,4,16,.45)'; g.fillRect(0, 0, VW, VH);
  ctx.drawImage(low, 0, 0, VW * SCALE, VH * SCALE);
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!S) { drawIdle(now); return; }
  DT = Math.min(0.05, (now - last) / 1000); last = now;
  if (S.state === 'play') { if (S.stop > 0) S.stop -= DT; else update(); }
  if (bannerT > 0) { bannerT -= DT; if (bannerT <= 0) $('banner').hidden = true; }
  draw(); hud();
}
requestAnimationFrame(frame);
const ready = () => Object.values(IMG).every(im => im.complete && im.naturalWidth);
function whenReady(fn) { if (ready()) fn(); else setTimeout(() => whenReady(fn), 50); }
$('startBtn').onclick = () => { audioInit(); whenReady(() => newGame('normal')); };
$('hardBtn').onclick = () => { audioInit(); whenReady(() => newGame('hard')); };
$('againBtn').onclick = () => { audioInit(); newGame(S ? S.diff : 'normal'); };
setTimeout(() => $('startBtn').focus(), 100);

// ---------- 功德簿 (leaderboard) ----------
let DB = null, USER = null, myEntry = null, boardNote = '';
(async () => {
  try { if (window.claude && window.claude.use) { DB = await window.claude.use('db'); USER = await window.claude.use('user'); } } catch (e) { DB = null; }
})();
const WEB = /^https?:$/.test(location.protocol) && !/claude\.ai|claudeusercontent|itch\.(io|zone)|hwcdn/.test(location.hostname);
async function webGet() { const r = await fetch('/api/scores', { cache: 'no-store' }); if (!r.ok) throw new Error('http ' + r.status); const j = await r.json(); if (!Array.isArray(j)) throw new Error('bad'); return j; }
async function webPost(rec) { const r = await fetch('/api/scores', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(rec) }); if (!r.ok) throw new Error('http ' + r.status); const j = await r.json(); if (!Array.isArray(j)) throw new Error('bad'); return j; }
function localBoard() { try { return JSON.parse(localStorage.getItem('ztzh_board') || '[]'); } catch (e) { return []; } }
async function renderBoard() {
  const box = $('board'); let rows = null, shared = false;
  if (DB) { try { const snap = await DB.collection('scores').orderBy('score', 'desc').limit(10).get(); rows = snap.docs.map(d => d.data()).filter(Boolean); shared = true; } catch (e) { rows = null; } }
  if (!rows && WEB) { try { rows = await webGet(); shared = true; } catch (e) { rows = null; } }
  if (!rows) rows = localBoard();
  box.textContent = '';
  const h = document.createElement('h3'); h.textContent = shared ? '功德簿 · 所有道友' : '功德簿 · 本机'; box.appendChild(h);
  if (!rows.length) { const p = document.createElement('div'); p.className = 'empty'; p.textContent = boardNote || '还没有记录，留下你的道号做第一个。'; box.appendChild(p); return; }
  const t = document.createElement('table'), hr = document.createElement('tr');
  for (const c of ['名次', '道号', '积分', '难度', '结果']) { const th = document.createElement('th'); th.textContent = c; hr.appendChild(th); }
  t.appendChild(hr);
  rows.slice(0, 10).forEach((r, i) => {
    const tr = document.createElement('tr');
    if (myEntry && r.at === myEntry.at && r.name === myEntry.name) tr.className = 'me';
    for (const v of [i + 1, String(r.name || '无名道士').slice(0, 10), Number(r.score) || 0, r.diff === 'hard' ? '困难' : '普通', r.win ? '天亮' : '倒下']) { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); }
    t.appendChild(tr);
  });
  box.appendChild(t);
  if (boardNote) { const n = document.createElement('div'); n.className = 'empty'; n.textContent = boardNote; box.appendChild(n); }
}
$('nameForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  if (!S || S.state !== 'over') return;
  const name = ($('nameIn').value || '').trim().slice(0, 10) || '无名道士';
  try { localStorage.setItem('ztzh_name', name); } catch (e) {}
  const rec = { name, score: S.score, kills: S.kills, lv: S.lv, t: Math.floor(S.t), win: !!S.win, diff: S.diff, at: Date.now() };
  myEntry = rec; $('saveBtn').disabled = true;
  try { const arr = localBoard(); arr.push(rec); arr.sort((a, b) => b.score - a.score); localStorage.setItem('ztzh_board', JSON.stringify(arr.slice(0, 20))); } catch (e) {}
  if (!DB && WEB) {
    try { await webPost(rec); } catch (e) { boardNote = '这次成绩只记在本机：暂时连不上共享功德簿。'; }
  }
  if (DB && USER) {
    try {
      const uid = await USER.id();
      if (!uid) throw new Error('no id');
      const ref = DB.doc('scores/' + uid), old = await ref.get(), od = old.data && old.data(); if (!od || (Number(od.score) || 0) < rec.score) await ref.set(rec);
    } catch (e) { boardNote = '这次成绩只记在本机：你在这个页面没有写入共享功德簿的权限。'; }
  }
  $('nameForm').hidden = true;
  renderBoard();
});
</script>
